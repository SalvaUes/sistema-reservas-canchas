<div class="dashboard">
  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <div class="profile-container fade-in">
      <div class="profile-header">
        <h1>Mi Perfil</h1>
        <p>Administra tu información personal</p>
      </div>

      <div class="profile-card" *ngIf="!isLoading; else loadingTpl">
        
        <div class="avatar-section">
          <div class="avatar-circle">
            {{ firstName.charAt(0) | uppercase }}{{ lastName.charAt(0) | uppercase }}
          </div>
          <div class="role-badge">{{ user?.role }}</div>
        </div>

        <form (ngSubmit)="saveProfile()" class="profile-form">
          
          <div class="form-row">
            <div class="form-group">
              <label for="email">Correo Electrónico</label>
              <input 
                type="email" 
                id="email" 
                [value]="email" 
                disabled 
                class="input-disabled"
                title="El correo no se puede modificar"
              >
              <small class="hint">El correo no se puede cambiar.</small>
            </div>
          </div>

          <div class="form-row two-cols">
            <div class="form-group">
              <label for="firstName">Nombre *</label>
              <input 
                type="text" 
                id="firstName" 
                [(ngModel)]="firstName" 
                name="firstName" 
                placeholder="Tu nombre"
                maxlength="50"
              >
            </div>

            <div class="form-group">
              <label for="lastName">Apellido *</label>
              <input 
                type="text" 
                id="lastName" 
                [(ngModel)]="lastName" 
                name="lastName" 
                placeholder="Tu apellido"
                maxlength="50"
              >
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Teléfono</label>
              <input 
                type="tel" 
                id="phone" 
                [(ngModel)]="phoneNumber" 
                name="phone" 
                placeholder="+503 0000 0000"
              >
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="save-btn" [disabled]="isSaving">
              <span *ngIf="!isSaving">Guardar Cambios</span>
              <span *ngIf="isSaving">Guardando...</span>
            </button>
          </div>

        </form>
      </div>

      <ng-template #loadingTpl>
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Cargando información...</p>
        </div>
      </ng-template>
    </div>
  </main>
</div>
