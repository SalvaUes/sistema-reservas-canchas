spring.application.name=backend

# ================================
# SERVER & CORS
# ================================
# En producción, asegúrate de definir esta variable en tu nube con el dominio real del frontend
# Ej: https://mi-app-canchas.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
server.port=${BACKEND_PORT}

# ================================
# DATASOURCE (NeonDB)
# ================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE
# ================================
# 'update' está bien para fases iniciales. En producción estricta se suele usar 'validate'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
# ZONA HORARIA
# ================================
spring.jackson.time-zone=America/El_Salvador
spring.datasource.time-zone=America/El_Salvador

# ================================
# AUTH0 CONFIGURATION (Resource Server)
# ================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${AUTH0_DOMAIN}/.well-known/jwks.json

auth0.claims.roles=${AUTH0_CLAIMS_NAMESPACE}

# ================================
# AUTH0 MANAGEMENT API (Backend Client)
# ================================
auth0.domain=${AUTH0_DOMAIN}
auth0.management.client-id=${AUTH0_MGT_CLIENT_ID}
auth0.management.client-secret=${AUTH0_MGT_CLIENT_SECRET}
auth0.roles.admin-id=${AUTH0_ROLE_ADMIN_ID}
auth0.roles.client-id=${AUTH0_ROLE_CLIENT_ID}