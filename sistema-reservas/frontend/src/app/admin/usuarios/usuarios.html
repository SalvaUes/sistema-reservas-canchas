<div class="dashboard">
  <main>
    <section class="usuarios-section">
      <h1>Usuarios</h1>

      <div class="users-toolbar">
        <div class="search-box">
          <input 
            type="text" 
            placeholder="Buscar por nombre o email, rol, estado ..." 
            [(ngModel)]="searchTerm" 
            (input)="filterUsers()" 
            autocomplete="off" 
            spellcheck="false" 
          />
        </div>
      </div>

      <!-- MODAL -->
      <div class="modal-backdrop" *ngIf="showForm" (click)="cancelForm()">
        <div class="modal" (click)="$event.stopPropagation()">
          <h2>Editar Usuario</h2>

          <div class="form-group">
            <label>Email (Solo lectura):</label>
            <input type="email" [value]="email" disabled class="form-control disabled-input" />
          </div>

          <div class="form-group">
            <label>Nombre*:</label>
            <input type="text" [(ngModel)]="firstName" maxlength="50" placeholder="Máx. 50 caracteres"/>
          </div>
          <div class="form-group">
            <label>Apellido*:</label>
            <input type="text" [(ngModel)]="lastName" maxlength="50"  placeholder="Máx. 50 caracteres"/>
          </div>
          <div class="form-group">
            <label>Teléfono:</label>
            <input type="text" [(ngModel)]="phoneNumber" />
          </div>
          <div class="form-group">
            <label>Rol:</label>
            <select [(ngModel)]="role">
              <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
            </select>
          </div>

          <div class="form-actions">
            <button (click)="submitForm()">Guardar Cambios</button>
            <button type="button" (click)="cancelForm()">Cancelar</button>
          </div>
        </div>
      </div>

      <!-- CHECKBOX GLOBAL -->
      <div class="users-toolbar">
        <div class="select-global">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              [checked]="selectAllGlobal" 
              (change)="toggleSelectAllGlobal($event)" 
            />
            <span>Seleccionar todos los registros filtrados</span>
          </label>
        </div>

        <div class="bulk-actions" *ngIf="selectedCount > 0">
          <button class="activate-btn" (click)="activateSelectedUsers()">
            🔓 Activar seleccionados
          </button>
          <button class="deactivate-btn" (click)="deactivateSelectedUsers()">
            🔒 Desactivar seleccionados
          </button>
        </div>
      </div>

      <!-- TABLA -->
      <div class="table-container">
        <table class="usuarios-table">
          <thead>
            <tr>
              <th>
                <input 
                  type="checkbox" 
                  [checked]="areAllSelected()" 
                  (change)="toggleSelectAllPage($event)" 
                />
              </th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Estado</th>
              <th *ngIf="userRole === 'ADMIN'">Acciones</th>
            </tr>
          </thead>
          
          <tbody>
            <tr *ngFor="let user of paginatedUsers">
              <td>
                <input
                  type="checkbox"
                  [checked]="selectedUserIds.has(user.id)"
                  (change)="onUserSelect(user, $event)"
                  [disabled]="user.email === userEmail"
                />
              </td>

              <td>{{ user.firstName }} {{ user.lastName }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.role }}</td>

              <td>
                <span 
                  [ngClass]="{
                    'text-success': user.status === 'ACTIVE',
                    'text-danger': user.status === 'INACTIVE'
                  }"
                >
                  {{ user.status === 'ACTIVE' ? 'Activo' : 'Inactivo' }}
                </span>
              </td>

              <td class="acciones" *ngIf="userRole === 'ADMIN'">
                <button 
                  class="edit-btn" 
                  (click)="openForm(user)" 
                  [disabled]="user.status === 'INACTIVE'"
                >
                  ✏️ Editar
                </button>

                <button 
                  *ngIf="user.status === 'ACTIVE'" 
                  class="deactivate-btn" 
                  (click)="deactivateUser(user)"
                  [disabled]="user.role === 'ADMIN'"
                >
                  🔒 Desactivar
                </button>

                <button 
                  *ngIf="user.status === 'INACTIVE'" 
                  class="activate-btn" 
                  (click)="activateUser(user)"
                >
                  🔓 Reactivar
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <p *ngIf="selectedCount > 0" 
           style="margin-top: 10px; font-size: 0.9em; color: #666;">
          {{ selectedCount }} usuario(s) seleccionado(s)
        </p>

        <div class="pagination" *ngIf="totalPages > 1">
          <button (click)="previousPage()" [disabled]="currentPage === 1">⬅ Anterior</button>
          <span>Página {{ currentPage }} de {{ totalPages }}</span>
          <button (click)="nextPage()" [disabled]="currentPage === totalPages">Siguiente ➡</button>
        </div>

      </div>
    </section>
  </main>
</div>
