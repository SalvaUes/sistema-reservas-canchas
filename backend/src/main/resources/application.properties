spring.application.name=backend

# ================================
# SEGURIDAD Y CORS
# ================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

# ================================
# DATASOURCE (PostgreSQL Local/Docker)
# ================================
# "db" es el nombre del servicio en tu docker-compose.yml
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/postgres}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
# ZONA HORARIA
# ================================
spring.jackson.time-zone=America/El_Salvador
spring.datasource.time-zone=America/El_Salvador

# ================================
# SERVER
# ================================
server.port=${BACKEND_PORT:8080}

# ================================
# AUTH0 CONFIGURATION
# ================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audience=${AUTH0_AUDIENCE}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${AUTH0_DOMAIN}/.well-known/jwks.json

auth0.claims.roles=${AUTH0_CLAIMS_NAMESPACE}

# ================================
# AUTH0 MANAGEMENT API
# ================================
auth0.domain=${AUTH0_DOMAIN}
auth0.management.client-id=${AUTH0_MGT_CLIENT_ID}
auth0.management.client-secret=${AUTH0_MGT_CLIENT_SECRET}
auth0.roles.admin-id=${AUTH0_ROLE_ADMIN_ID}
auth0.roles.client-id=${AUTH0_ROLE_CLIENT_ID}